apiVersion: apps/v1
kind: Deployment

metadata:
  name: nginx
  namespace: azurelabs
  labels:
    app: nginx
    project: AzureLabs

spec:
  replicas: 1

  selector:
    matchLabels:
      app: nginx

  template:
    metadata:
      labels:
        app: nginx
        project: AzureLabs

    spec:
      containers:
        - name: nginx
          image: nginx:1.29-alpine

          ports:
            - name: http
              containerPort: 80
              protocol: TCP

          resources:
            requests:
              cpu: 10m
              memory: 16Mi
            limits:
              cpu: 100m
              memory: 64Mi